name: Run DSE Scraper

on:
  schedule:
    # Dhaka time 14:30 (market close 14:20 এর পরে) = UTC 08:30
    # Sunday–Thursday (DSE working days)
    - cron: '30 8 * * 0-4'
  workflow_dispatch:  # ম্যানুয়ালি চালাতে পারবে

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ⚡ Puppeteer Chromium cache
      - name: Cache Puppeteer
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci || npm install

      # ⚡ Chromium system libraries (Puppeteer-এর জন্য জরুরি)
      - name: Install Chromium dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ca-certificates fonts-liberation \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 \
            libc6 libcairo2 libcups2t64 libdbus-1-3 libexpat1 \
            libfontconfig1 libgbm1 libgcc-s1 libglib2.0-0t64 \
            libgtk-3-0t64 libnspr4 libnss3 libpango-1.0-0 \
            libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 \
            libxcb1 libxcomposite1 libxcursor1 libxdamage1 \
            libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 \
            libxss1 libxtst6 lsb-release wget xdg-utils

      - name: Run Scraper
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGODBEMAIL_URI: ${{ secrets.MONGO_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node services/dseScraper.js
